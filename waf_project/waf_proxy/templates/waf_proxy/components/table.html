<!-- Simple Table Component -->
<div class="table-container card">
    {% if title %}
        <div class="card-header">
            <h3 class="section-title">{{ title }}</h3>
            {% if subtitle %}
                <p class="mb-0">{{ subtitle }}</p>
            {% endif %}
        </div>
    {% endif %}
    
    <div class="table-wrapper">
        <table class="table">
            {% if headers %}
                <thead>
                    <tr>
                        {% for header in headers %}
                            <th>{{ header }}</th>
                        {% endfor %}
                    </tr>
                </thead>
            {% endif %}
            <tbody>
                {% block table_body %}
                    <!-- Table content goes here -->
                {% endblock %}
            </tbody>
        </table>
    </div>
</div>

<style>
.table-container {
    overflow: hidden;
}

.table-wrapper {
    overflow-x: auto;
}

.table th:first-child {
    border-top-left-radius: 0;
}

.table th:last-child {
    border-top-right-radius: 0;
}

/* Action buttons in table */
.table-actions {
    display: flex;
    gap: var(--spacing-2);
    align-items: center;
}

.table-actions .btn {
    padding: var(--spacing-1) var(--spacing-2);
    font-size: 12px;
}

/* Status indicators in tables */
.status-cell {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-2);
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
}

.status-dot.active {
    background-color: var(--success-green);
}

.status-dot.inactive {
    background-color: var(--text-muted);
}

/* Responsive table */
@media (max-width: 768px) {
    .table-wrapper {
        -webkit-overflow-scrolling: touch;
    }
    
    .table th,
    .table td {
        padding: var(--spacing-2) var(--spacing-3);
        font-size: 12px;
    }
    
    .table-actions {
        flex-direction: column;
        gap: var(--spacing-1);
    }
    
    .table-actions .btn {
        width: 100%;
        font-size: 11px;
        padding: var(--spacing-1);
    }
}

/* Empty state */
.table-empty {
    text-align: center;
    padding: var(--spacing-8) var(--spacing-4);
    color: var(--text-muted);
}

.table-empty i {
    font-size: 32px;
    margin-bottom: var(--spacing-4);
    opacity: 0.5;
}

.table-empty h4 {
    margin-bottom: var(--spacing-2);
    color: var(--text-secondary);
}

.table-empty p {
    margin-bottom: 0;
}
</style>
