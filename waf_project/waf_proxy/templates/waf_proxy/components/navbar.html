<!-- Cloudflare-style Navigation Component -->
<nav class="bg-white border-b border-cf-200 shadow-cf fixed top-0 w-full z-50">
    <div class="px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <!-- Logo and Brand -->
            <div class="flex items-center">
                <a href="{% if user.is_authenticated %}{% if user.user_type == 'admin' %}{% url 'admin_dashboard' %}{% else %}{% url 'customer_dashboard' %}{% endif %}{% else %}/{% endif %}" class="flex items-center space-x-3">
                    <div class="flex items-center justify-center w-8 h-8 bg-gradient-to-br from-primary-500 to-secondary-600 rounded-lg shadow-cf">
                        <i class="fas fa-shield-alt text-white text-sm"></i>
                    </div>
                    <span class="text-xl font-semibold text-cf-900 tracking-tight">WAF Security</span>
                </a>
            </div>

            <!-- Right side - Search, Notifications, User Menu -->
            <div class="flex items-center space-x-4">
                <!-- Search Bar (hidden on mobile) -->
                <div class="hidden md:block">
                    <div class="relative">
                        <input type="text" placeholder="Search..." class="bg-cf-50 border border-cf-300 text-cf-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-64 pl-10 p-2.5">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-search text-cf-400"></i>
                        </div>
                    </div>
                </div>

                {% if user.is_authenticated %}
                    <!-- Notifications -->
                    <button type="button" class="relative p-2 text-cf-400 hover:text-cf-600 hover:bg-cf-100 rounded-lg transition-colors duration-200">
                        <i class="fas fa-bell w-5 h-5"></i>
                        <span class="absolute top-0 right-0 inline-flex items-center justify-center w-2 h-2 text-xs font-bold leading-none text-red-100 bg-red-600 rounded-full"></span>
                    </button>

                    <!-- User role badge -->
                    <span class="hidden lg:inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium {% if user.user_type == 'admin' %}bg-primary-100 text-primary-800{% else %}bg-secondary-100 text-secondary-800{% endif %}">
                        {{ user.user_type|title }}
                    </span>
                    
                    <!-- User dropdown -->
                    <div class="relative">
                        <button type="button" class="flex items-center space-x-3 text-sm rounded-lg hover:bg-cf-100 p-2 transition-colors duration-200" id="user-menu-button" aria-expanded="false" data-dropdown-toggle="user-dropdown" data-dropdown-placement="bottom-end">
                            <div class="w-8 h-8 bg-gradient-to-br from-primary-500 to-secondary-600 rounded-full flex items-center justify-center text-white font-medium text-sm shadow-cf">
                                {{ user.first_name|first|upper|default:"U" }}{{ user.last_name|first|upper|default:"" }}
                            </div>
                            <div class="hidden lg:block text-left">
                                <div class="text-sm font-medium text-cf-900">{{ user.first_name|default:"User" }} {{ user.last_name|default:"" }}</div>
                                <div class="text-xs text-cf-500">{{ user.email|truncatechars:20 }}</div>
                            </div>
                            <i class="fas fa-chevron-down text-cf-400 w-3 h-3"></i>
                        </button>
                        
                        <!-- Dropdown menu -->
                        <div class="z-50 hidden my-2 text-base list-none bg-white divide-y divide-cf-100 rounded-lg shadow-cf-lg w-56" id="user-dropdown">
                            <div class="px-4 py-3">
                                <span class="block text-sm font-medium text-cf-900">{{ user.first_name }} {{ user.last_name|default:"" }}</span>
                                <span class="block text-sm text-cf-500 truncate">{{ user.email }}</span>
                            </div>
                            <ul class="py-2" aria-labelledby="user-menu-button">
                                <li>
                                    <a href="{% url 'profile' %}" class="flex items-center px-4 py-2 text-sm text-cf-700 hover:bg-cf-100 transition-colors duration-200">
                                        <i class="fas fa-user mr-3 text-cf-400"></i>Profile
                                    </a>
                                </li>
                                <li>
                                    <a href="{% url 'user_settings' %}" class="flex items-center px-4 py-2 text-sm text-cf-700 hover:bg-cf-100 transition-colors duration-200">
                                        <i class="fas fa-cog mr-3 text-cf-400"></i>Settings
                                    </a>
                                </li>
                                {% if user.user_type == 'admin' %}
                                    <li>
                                        <a href="{% url 'system_status' %}" class="flex items-center px-4 py-2 text-sm text-cf-700 hover:bg-cf-100 transition-colors duration-200">
                                            <i class="fas fa-server mr-3 text-cf-400"></i>System Status
                                        </a>
                                    </li>
                                {% endif %}
                                <li><hr class="my-1 border-cf-200"></li>
                                <li>
                                    <a href="{% url 'logout' %}" class="flex items-center px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors duration-200">
                                        <i class="fas fa-sign-out-alt mr-3 text-red-500"></i>Sign out
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                {% else %}
                    <!-- Login/Register buttons for non-authenticated users -->
                    <div class="flex items-center space-x-3">
                        <a href="{% url 'login' %}" class="text-cf-700 hover:text-cf-900 font-medium text-sm transition-colors duration-200">
                            Sign in
                        </a>
                        <a href="{% url 'register' %}" class="bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-lg text-sm px-4 py-2 transition-colors duration-200">
                            Get started
                        </a>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
