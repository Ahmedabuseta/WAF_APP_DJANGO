{% extends "waf_proxy/main_layout.html" %}

{% block main_content %}
    {% block dashboard_content %}{% endblock %}
{% endblock %}

<style>
.main-content {
    margin-left: 280px;
    min-height: 100vh;
    background-color: var(--bg-secondary);
}

.mobile-header {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: var(--spacing-4);
    background-color: var(--bg-primary);
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 100;
}

.hamburger {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 18px;
    cursor: pointer;
    padding: var(--spacing-2);
    border-radius: var(--border-radius);
}

.hamburger:hover {
    background-color: var(--bg-tertiary);
}

.mobile-brand {
    display: flex;
    align-items: center;
    gap: var(--spacing-2);
    font-weight: 600;
    color: var(--text-primary);
}

.mobile-brand i {
    color: var(--primary-orange);
}

.mobile-user {
    width: 32px;
    height: 32px;
    background-color: var(--bg-tertiary);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
}

.page-header {
    background-color: var(--bg-primary);
    border-bottom: 1px solid var(--border-color);
    padding: var(--spacing-6) var(--spacing-6) var(--spacing-4);
}

.header-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-4);
}

.header-title h1 {
    font-size: 1.875rem;
    font-weight: 700;
    margin-bottom: var(--spacing-1);
    color: var(--text-primary);
}

.header-title p {
    color: var(--text-secondary);
    margin-bottom: 0;
}

.header-actions {
    display: flex;
    gap: var(--spacing-3);
    align-items: center;
}

.content {
    padding: var(--spacing-6);
}

/* Dashboard Grid System */
.dashboard-grid {
    display: grid;
    gap: var(--spacing-6);
    margin-bottom: var(--spacing-8);
}

.dashboard-grid.cols-1 {
    grid-template-columns: 1fr;
}

.dashboard-grid.cols-2 {
    grid-template-columns: repeat(2, 1fr);
}

.dashboard-grid.cols-3 {
    grid-template-columns: repeat(3, 1fr);
}

.dashboard-grid.cols-4 {
    grid-template-columns: repeat(4, 1fr);
}

/* Dashboard Sections */
.dashboard-section {
    margin-bottom: var(--spacing-8);
}

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--spacing-4);
}

.section-title {
    font-size: 1.125rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 0;
}

.section-actions {
    display: flex;
    gap: var(--spacing-2);
}

/* Stats Cards */
.stats-card {
    background-color: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    padding: var(--spacing-6);
    transition: all 0.2s ease;
}

.stats-card:hover {
    box-shadow: var(--shadow);
}

.stats-content {
    display: flex;
    align-items: center;
    gap: var(--spacing-4);
}

.stats-icon {
    width: 48px;
    height: 48px;
    border-radius: var(--border-radius);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--text-white);
}

.stats-icon.primary {
    background-color: var(--primary-orange);
}

.stats-icon.success {
    background-color: var(--success-green);
}

.stats-icon.warning {
    background-color: var(--warning-yellow);
}

.stats-icon.danger {
    background-color: var(--error-red);
}

.stats-info {
    flex: 1;
}

.stats-value {
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1;
    margin-bottom: var(--spacing-1);
}

.stats-label {
    color: var(--text-secondary);
    font-weight: 500;
    margin-bottom: 0;
}

.stats-change {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-1);
    font-size: 12px;
    font-weight: 500;
    margin-top: var(--spacing-1);
}

.stats-change.positive {
    color: var(--success-green);
}

.stats-change.negative {
    color: var(--error-red);
}

/* Status Indicators */
.status-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: var(--spacing-4);
}

.status-item {
    display: flex;
    align-items: center;
    gap: var(--spacing-3);
    padding: var(--spacing-4);
    background-color: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
}

.status-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
}

.status-indicator.online {
    background-color: var(--success-green);
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
}

.status-indicator.offline {
    background-color: var(--error-red);
    box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
}

.status-indicator.warning {
    background-color: var(--warning-yellow);
    box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
}

.status-text {
    color: var(--text-secondary);
    font-weight: 500;
}

/* Responsive Design */
@media (max-width: 1024px) {
    .main-content {
        margin-left: 0;
    }
    
    .mobile-header {
        display: flex;
    }
    
    .dashboard-grid.cols-2,
    .dashboard-grid.cols-3,
    .dashboard-grid.cols-4 {
        grid-template-columns: 1fr;
    }
    
    .header-content {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--spacing-4);
    }
    
    .header-actions {
        width: 100%;
        justify-content: flex-end;
    }
}

@media (max-width: 640px) {
    .page-header,
    .content {
        padding: var(--spacing-4);
    }
    
    .stats-content {
        gap: var(--spacing-3);
    }
    
    .stats-icon {
        width: 40px;
        height: 40px;
        font-size: 18px;
    }
    
    .stats-value {
        font-size: 1.5rem;
    }
}

/* Loading States */
.loading-skeleton {
    background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--bg-secondary) 50%, var(--bg-tertiary) 75%);
    background-size: 200% 100%;
    animation: loading 1.5s infinite;
    border-radius: var(--border-radius);
}

.skeleton-text {
    height: 16px;
    margin-bottom: var(--spacing-2);
}

.skeleton-text.large {
    height: 24px;
}

.skeleton-text.small {
    height: 12px;
    width: 60%;
}
</style>
{% endblock %}
